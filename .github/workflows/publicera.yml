# Bygger och publicerar hemsidan på GitHub Pages vid varje ändring i main
# (även ändringar gjorda via Pages CMS).
name: Publicera hemsidan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ger sökvägen sajten ligger på: "/brffloragarden.se" på testadressen,
      # tom när egen domän är kopplad.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicera:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
