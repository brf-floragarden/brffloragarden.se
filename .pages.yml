# Konfiguration för Pages CMS (https://pagescms.org) – ett gratis webbgränssnitt
# där styrelsen kan redigera hemsidan utan att kunna kod. Se README.md.

media:
  - name: arsredovisningar
    label: Årsredovisningar (PDF)
    input: src/filer/arsredovisningar
    output: /filer/arsredovisningar
    extensions: [pdf]
  - name: filer
    label: Övriga filer
    input: src/filer
    output: /filer
  - name: bilder
    label: Bilder
    input: src/img
    output: /img
    extensions: [jpg, jpeg, png, webp]

content:
  - name: forening
    label: Föreningen (adresser, e-post)
    type: file
    path: src/_data/forening.yml
    fields:
      - { name: namn, label: Kort namn, type: string }
      - { name: fulltNamn, label: Fullständigt namn, type: string }
      - { name: grundad, label: Grundad år, type: number }
      - { name: orgnr, label: Organisationsnummer, type: string }
      - { name: epost, label: E-post till styrelsen, type: string }
      - { name: postadress, label: Postadress (en rad per fält), type: string, list: true }
      - { name: fakturaadress, label: Fakturaadress (en rad per fält), type: string, list: true }
      - { name: jourtelefon, label: Jourtelefon vid akut skada, type: string, list: true }

  - name: styrelse
    label: Styrelse
    type: file
    path: src/_data/styrelse.yml
    fields:
      - name: ledamoter
        label: Ledamöter
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.namn} – {fields.roll}" } }
        fields:
          - { name: namn, label: Namn, type: string }
          - name: roll
            label: Roll
            type: select
            options:
              values: [Ordförande, Ledamot, Suppleant]
      - { name: revisor, label: Revisor, type: string }

  - name: dokument
    label: Dokument (stadgar, länkar)
    type: file
    path: src/_data/dokument.yml
    fields:
      - name: stadgar
        label: Stadgar
        type: object
        fields:
          - { name: titel, label: Titel, type: string }
          - { name: beskrivning, label: Beskrivning, type: string }
          - name: fil
            label: PDF
            type: file
            description: Klicka för att välja eller ladda upp stadgarna som PDF.
            options: { media: filer, extensions: [pdf] }
      - name: ovriga
        label: Lagar och förteckningar
        description: Varje rad är antingen en uppladdad fil ELLER en länk till en annan webbplats – fyll i det ena.
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.titel}" } }
        fields:
          - { name: titel, label: Titel, type: string }
          - { name: beskrivning, label: Beskrivning (valfri), type: string }
          - name: fil
            label: Fil
            type: file
            description: Välj eller ladda upp en fil (PDF, bild).
            options: { media: filer }
          - name: lank
            label: Länk till annan webbplats
            type: string
            description: Hela adressen, t.ex. https://www.riksdagen.se/… Lämna tomt om du valt en fil ovan.
      - name: bilder
        label: Historiska bilder (länkar till andra webbplatser)
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.titel}" } }
        fields:
          - { name: titel, label: Titel, type: string }
          - name: lank
            label: Länk
            type: string
            description: Hela adressen till bilden, t.ex. https://bilderisyd.se/…
      - name: kartor
        label: Kartor
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.titel}" } }
        fields:
          - { name: titel, label: Titel, type: string }
          - name: fil
            label: Fil
            type: file
            description: Välj eller ladda upp kartan (PDF eller bild).
            options: { media: filer }

  - name: fastigheten
    label: Fakta om fastigheten
    type: file
    path: src/_data/fastigheten.yml
    fields:
      - name: grupper
        label: Faktarutor
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.rubrik}" } }
        fields:
          - { name: rubrik, label: Rubrik, type: string }
          - name: rader
            label: Rader
            type: object
            list: { collapsible: { collapsed: false, summary: "{fields.etikett}" } }
            fields:
              - { name: etikett, label: Etikett, type: string }
              - { name: varde, label: Värde, type: string }

  - name: leverantorer
    label: Leverantörer
    type: file
    path: src/_data/leverantorer.yml
    list: true
    fields:
      - { name: namn, label: Företag, type: string }
      - { name: tjanst, label: Tjänst, type: string }

  - name: information
    label: Sida – Allmän information (text)
    type: file
    path: src/information.md
    fields:
      - { name: layout, type: string, hidden: true }
      - { name: titel, label: Titel, type: string }
      - { name: permalink, type: string, hidden: true }
      - { name: body, label: Text, type: rich-text }

  - name: historia
    label: Sida – Historia
    type: file
    path: src/historia.md
    fields:
      - { name: layout, type: string, hidden: true }
      - { name: titel, type: string, hidden: true }
      - { name: permalink, type: string, hidden: true }
      - { name: rubrik, label: Rubrik, type: string }
      - name: omslag
        label: Omslagsbild
        type: image
        description: Bilden högst upp på sidan. Lämna tom för att visa sidan utan bild.
        options: { media: bilder }
      - { name: body, label: Inledande text om Rörsjöstaden, type: rich-text }
      - { name: tidslinjeRubrik, label: Rubrik för tidslinjen, type: string }
      - name: handelser
        label: Tidslinje – en rad per händelse, i årtalsordning
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.ar}" } }
        fields:
          - { name: ar, label: År, type: string }
          - name: text
            label: "Vad hände (fortsätter meningen efter årtalet, t.ex. ”byggs balkonger mot innergården.”)"
            type: text
